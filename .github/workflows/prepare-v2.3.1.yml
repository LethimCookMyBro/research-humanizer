name: Verify v2.3.1 punctuation source
on:
  push:
    branches:
      - maintenance/prepare-v2.3.1
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'LethimCookMyBro/research-humanizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checksum-locked punctuation patch
        run: python3 .maintenance/prepare-punctuation.py
      - name: Repository and website contracts
        run: python3 -B -m unittest discover -s tests -v
      - name: Skill tools and punctuation cases
        run: python3 -B -m unittest discover -s skills/research-paper-craft/tests -v
      - name: Historical regressions
        run: python3 -B docs/audit-v2.0/audit_regressions.py skills/research-paper-craft
      - name: Upload tested tree without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'LethimCookMyBro/research-humanizer'
          base = 'bedb58e290b4dc6365c47be669927d6c94246977'
          base_tree = '64b2c0c689f6e043cebc41fe3ba0b8cddedc6414'
          record = json.loads(Path('.git/punctuation-prepared.json').read_text())
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert record['base'] == base and record['base_tree'] == base_tree
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == record['tree']
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(names) == 25 and sorted(names) == sorted(x['path'] for x in record['files'])
          entries = []
          for item in record['files']:
              path = item['path']
              assert not path.startswith(('.github/', '.maintenance/'))
              raw = Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == item['sha'], path
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'content': raw.decode('utf-8')})
          data = json.dumps({'base_tree': base_tree, 'tree': entries}, ensure_ascii=False).encode('utf-8')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/trees', data=data, headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          assert result['sha'] == record['tree'], result['sha']
          print('VERIFIED_RELEASE_TREE=' + result['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Verified punctuation source\n\nAll repository, skill and historical regression suites passed.\n\nExact Git tree `' + result['sha'] + '` uploaded. No commit, main-branch update or release was created by this job.\n')
          PY
