name: Verify v2.3.2 text integrity
on:
  push:
    branches:
      - maintenance/prepare-v2.3.2
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'LethimCookMyBro/research-humanizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce failures then verify final source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .maintenance/prepare232.py
