name: Verify v2.2.0 release tree
on:
  push:
    branches:
      - maintenance/prepare-v2.2.0
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'LethimCookMyBro/research-humanizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checksum-locked release plan
        run: python3 .release/prepare.py
      - name: Run repository contracts
        run: python3 -B -m unittest discover -s tests -v
      - name: Run skill contracts and tool tests
        run: python3 -B -m unittest discover -s skills/research-paper-craft/tests -v
      - name: Verify all five historical regressions are fixed
        run: python3 -B docs/audit-v2.0/audit_regressions.py skills/research-paper-craft
      - name: Upload verified source blobs without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request, urllib.error
          from pathlib import Path
          repo = 'LethimCookMyBro/research-humanizer'
          base = '21dfaf56da1f59fbd48d5810d8b867ec9a667cc1'
          expected = '1e6110eabc528d9685326986a567c6bc44be22a0'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(names) == 53
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          uploaded = []
          for name in names:
              raw = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if name.startswith('.github/'):
                  print('MAINTAINER_UPLOAD_REQUIRED=' + json.dumps({'path': name, 'sha': sha}))
                  continue
              body = json.dumps({'content': raw.decode('utf-8'), 'encoding': 'utf-8'}, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs', data=body, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  detail = json.loads(error.read().decode('utf-8'))
                  print('UPLOAD_REJECTED=' + json.dumps({'status': error.code, 'message': detail.get('message'), 'path': name}))
                  raise SystemExit(1)
              assert result['sha'] == sha, name
              uploaded.append({'path': name, 'sha': sha})
              print('VERIFIED_SOURCE_BLOB=' + json.dumps(uploaded[-1]))
          assert len(uploaded) == 52
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## v2.2.0 source verification\n\n34 repository, 105 skill, and 5 historical tests passed.\n\n52 exact source blobs uploaded. Workflow file publication and branch changes remain with the maintainer connection. No branch was changed by this job.\n')
          PY
