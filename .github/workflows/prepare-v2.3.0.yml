name: Verify v2.3.0 source preparation
on:
  push:
    branches:
      - maintenance/prepare-v2.3.0
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'LethimCookMyBro/research-humanizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact source plan
        run: python3 .release/prepare.py
      - name: Repository tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Skill tests
        run: python3 -B -m unittest discover -s skills/research-paper-craft/tests -v
      - name: Historical regressions
        run: python3 -B docs/audit-v2.0/audit_regressions.py skills/research-paper-craft
      - name: Upload verified content blobs without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'LethimCookMyBro/research-humanizer'
          base = 'b9b5e01eceeda98e3ad6bdcc0744849b8c0bd509'
          expected = 'db691a51635c206e50a36421a4b0d0b5fc56a113'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == base
          assert subprocess.check_output(['git','write-tree'], text=True).strip() == expected
          subprocess.run(['git','diff','--exit-code'], check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().rstrip('\0').split('\0')
          assert len(names) == 41
          headers = {'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'}
          uploaded = 0
          for name in names:
              raw = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if name.startswith('.github/'):
                  print('MAINTAINER_UPLOAD_REQUIRED=' + json.dumps({'path':name,'sha':sha}))
                  continue
              body = json.dumps({'content':raw.decode('utf-8'),'encoding':'utf-8'}, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs', data=body, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              uploaded += 1
              print('VERIFIED_SOURCE_BLOB=' + json.dumps({'path':name,'sha':sha}))
          assert uploaded == 40
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('## Source verification\n\n50 repository, 134 skill and 5 historical tests passed.\n\n40 hash-verified content blobs uploaded. No branches, tags or releases were changed by this job.\n')
          PY
